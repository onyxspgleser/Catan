<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex Isles</title>
<style>
:root {
  --ocean: #0d2a44; --panel: #f6efe0; --paper: #fffaf0; --ink: #2b2118; --muted: #7d6f5d; --line: #dccfb4;
  --accent: #b83a2a; --accent-d: #8e2a1f; --gold: #f4c542; --gold-d: #b8901c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { min-height: 100%; background: radial-gradient(ellipse at 35% 25%, #1f5784 0%, #123a5c 45%, var(--ocean) 100%) fixed; color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.hidden { display: none !important; }
h1, h2 { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif; font-weight: 700; }
h2 { font-size: 20px; margin: 0 0 8px; }
h3 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
button { font: inherit; border: 1px solid #c4b291; background: var(--paper); color: var(--ink); border-radius: 9px; padding: 7px 11px; cursor: pointer; transition: background .12s, transform .05s; }
button:hover:not(:disabled) { background: #fff; border-color: #8a7552; }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .42; cursor: not-allowed; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent-d); font-weight: 600; }
button.primary:hover:not(:disabled) { background: #a3311f; }
button.on { background: var(--gold); border-color: var(--gold-d); font-weight: 600; }
button.link { border: none; background: none; text-decoration: underline; padding: 2px 4px; color: var(--accent); }
button.big { font-size: 17px; padding: 12px; width: 100%; margin-top: 12px; }
button.wide { width: 100%; }
input, select { font: inherit; padding: 7px 9px; border-radius: 9px; border: 1px solid #c4b291; background: #fff; color: var(--ink); }
.muted { color: var(--muted); } .small { font-size: 13px; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; } .seg button { border-radius: 0; margin-left: -1px; } .seg button:first-child { border-radius: 9px 0 0 9px; } .seg button:last-child { border-radius: 0 9px 9px 0; }
.ic { width: 1.15em; height: 1.15em; vertical-align: -.22em; flex-shrink: 0; }
#artDefs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* boxes */
.center { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 18px; }
.box { background: var(--panel); border-radius: 18px; padding: 22px; box-shadow: 0 24px 70px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.5); }
.home-box { width: 100%; max-width: 440px; }
.home-box h1 { margin: 0; font-size: 40px; display: flex; align-items: center; gap: 10px; }
.home-box h1 svg { width: 46px; height: 46px; }
.tag { margin: 2px 0 18px; color: var(--muted); }
.card-box { border: 1px solid var(--line); border-radius: 13px; padding: 12px 14px; margin: 10px 0; background: var(--paper); }
.card-box.focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(184,58,42,.18); }
.card-box .row input { flex: 1; min-width: 0; }
label.field { display: block; font-weight: 600; margin-bottom: 5px; }
#nameIn { width: 100%; }

/* lobby */
#lobby { min-height: 100%; padding: 18px; display: flex; justify-content: center; align-items: flex-start; }
.lobbygrid { display: grid; grid-template-columns: 300px minmax(0, 620px); gap: 16px; width: 100%; max-width: 950px; align-items: start; }
@media (max-width: 860px) { .lobbygrid { grid-template-columns: 1fr; } }
.code { font: 700 38px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 7px; text-align: center; padding: 12px; background: #fff; border-radius: 12px; border: 2px dashed var(--line); margin-bottom: 8px; }
.plist { list-style: none; padding: 0; margin: 0; } .plist li { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
.plist .sw { width: 12px; height: 12px; border-radius: 50%; } .plist .muted { font-weight: 400; font-size: 12px; }
.waiting { text-align: center; padding: 14px; background: #fff; border-radius: 12px; color: var(--muted); }
.mapname { font-weight: 700; font-size: 17px; }
#mapSel { width: 100%; font-weight: 600; }
.mapwrap { background: radial-gradient(ellipse at center, #1f5784, #0d2a44); border-radius: 14px; padding: 8px; margin: 8px 0 4px; }
#mapSvg { width: 100%; max-height: 420px; display: block; }
#mapSvg.editable { touch-action: none; cursor: crosshair; }
.ed-hex { stroke: rgba(0,0,0,.25); stroke-width: 1.2; } .ed-hex.land { stroke: #efe0b6; stroke-width: 2.5; }
.ed-empty { fill: rgba(255,255,255,.04); stroke: rgba(255,255,255,.22); stroke-dasharray: 3 3; }
#mapSvg.editable .ed-hex:hover, #mapSvg.editable .ed-empty:hover { stroke: var(--gold); stroke-width: 3; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 4px; margin: 6px 0; }
.palette button { padding: 4px 2px; display: flex; flex-direction: column; align-items: center; font-size: 10px; line-height: 1.1; }
.palette svg { width: 30px; height: 30px; }
.palette.nums button { font-size: 13px; padding: 8px 2px; } .palette.nums b { font: 700 18px Georgia, serif; } .palette.nums b.red { color: #b83a2a; }
.ed-hex.dim { opacity: .35; }
.num.ed { font-size: 12px; }
.edtop { margin: 8px 0 2px; gap: 8px; }
.ed-edge { stroke: #ffe94d; stroke-width: 6; stroke-dasharray: 7 4; stroke-linecap: round; cursor: pointer; animation: pulse 1s infinite alternate; }
.ed-edge:hover { stroke: #fff36b; } .ed-edge.has { stroke: rgba(255,255,255,.25); }
.swatches { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; }
.plist .swatches { margin-left: auto; gap: 3px; } .plist .swatches .swatch { width: 16px; height: 16px; }
.swatch { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 2px solid rgba(0,0,0,.35); }
.swatch.on { box-shadow: 0 0 0 3px var(--gold); border-color: #fff; }
.swatch:disabled { opacity: .25; }
.plist li { flex-wrap: wrap; }
.opts { display: grid; gap: 2px; }
.opt { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.numctl { display: flex; align-items: center; gap: 6px; } .numctl b { min-width: 26px; text-align: center; font-size: 16px; } .numctl button { width: 32px; padding: 4px 0; }
.switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: #cbbd9f; border-radius: 99px; transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch input:checked + span { background: var(--accent); } .switch input:checked + span::after { left: 21px; }
.switch input:disabled + span { cursor: default; opacity: .7; }

/* game layout */
#game { display: flex; height: 100%; }
#boardWrap { flex: 1; min-width: 0; position: relative; overflow: hidden; }
#board { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; transform-origin: 0 0; will-change: transform; }
.zoombar { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.zoombar button { width: 40px; height: 40px; padding: 0; font-size: 20px; font-weight: 700; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
#reconnect { position: absolute; top: 12px; left: 12px; }
#side { position: relative; width: 370px; flex-shrink: 0; background: var(--panel); overflow-y: auto; overflow-x: hidden; padding: 12px 14px 22px; box-shadow: -10px 0 34px rgba(0,0,0,.35); }
#sideGrip { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; cursor: ew-resize; z-index: 2; }
#sideGrip:hover { background: rgba(184,58,42,.25); }
#side > * { min-width: 0; }
@media (max-width: 900px) {
  #sideGrip { display: none; } #side { width: 100% !important; }
  #game { flex-direction: column; height: auto; }
  #boardWrap { height: 64vh; flex: none; }
  #side { width: 100%; box-shadow: 0 -10px 30px rgba(0,0,0,.3); }
}
.topline { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.statusline { font-size: 15.5px; margin: 8px 0; padding: 9px 11px; background: #fff; border-left: 5px solid var(--accent); border-radius: 8px; }
.acting { display: block; margin-top: 6px; font-size: 13px; } .acting select { padding: 3px 6px; } .mini { font-size: 12px; }
.dice { display: flex; align-items: center; gap: 6px; } .die { width: 34px; height: 34px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
.dice span { font: 700 22px Georgia, serif; margin-left: 4px; }
.pl { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; padding: 7px 10px 7px 12px; border-radius: 10px; margin: 4px 0; background: var(--paper); border: 1px solid transparent; position: relative; overflow: hidden; }
.pl::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--pc); }
.pl.cur { border-color: var(--gold-d); background: #fff6d2; box-shadow: 0 0 0 2px rgba(244,197,66,.45); }
.pl .pn { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .pl .pn small { font-weight: 400; color: var(--muted); }
.pl .off { color: var(--accent) !important; }
.pl .vp { font: 700 17px Georgia, serif; display: flex; align-items: center; gap: 3px; } .pl .vp small { font-size: 11px; color: var(--muted); }
.pl .st { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: #5d5040; } .pl .st span { display: inline-flex; align-items: center; gap: 2px; }
.pl .badges { display: flex; gap: 6px; font-size: 12px; justify-content: flex-end; } .pl .badges b { display: inline-flex; align-items: center; gap: 1px; background: #fff; border-radius: 6px; padding: 1px 4px; }
.hand { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.card { text-align: center; border-radius: 10px; padding: 6px 2px 5px; border: 1px solid rgba(0,0,0,.14); box-shadow: 0 2px 0 rgba(0,0,0,.08); }
.card .ic.big { width: min(30px, 70%); height: auto; aspect-ratio: 1; } .card b { display: block; font: 700 21px Georgia, serif; line-height: 1.1; } .card small { display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: #5d5040; }
.card.wood { background: linear-gradient(#d9ebcf, #c4dfb6); } .card.brick { background: linear-gradient(#f5d6c3, #ecbfa4); } .card.sheep { background: linear-gradient(#ebf6dc, #d8edbd); } .card.wheat { background: linear-gradient(#fbefbf, #f3df92); } .card.ore { background: linear-gradient(#e6e9ed, #d0d5db); }
.pieces { margin-top: 5px; }
#actions { margin-top: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.build { text-align: left; display: flex; flex-direction: column; gap: 2px; } .build > span { font-weight: 600; }
.chip { display: inline-flex; align-items: center; margin-right: 4px; } .chip b { font-size: 11px; margin-left: 1px; }
.hint { margin-top: 7px; font-size: 13px; background: #fff6d2; padding: 7px 9px; border-radius: 8px; }
button.end { width: 100%; margin-top: 10px; padding: 10px; font-weight: 700; }
.devrow { display: flex; gap: 6px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.devrow select, #trade select { padding: 4px 6px; font-size: 13px; }
.offer { background: #fff; padding: 9px; border-radius: 9px; margin-bottom: 6px; } .offer .chips { white-space: nowrap; }
details { margin-top: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 11px; }
summary { padding: 9px 12px; font-weight: 700; cursor: pointer; }
.tradebox { padding: 0 12px 12px; }
.steppers { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin: 4px 0 8px; }
.stp { text-align: center; background: #fff; border-radius: 9px; padding: 5px 2px; border: 1px solid var(--line); }
.stp > div { display: flex; align-items: center; justify-content: center; gap: 1px; flex-wrap: wrap; } .stp button { padding: 0 5px; border-radius: 6px; min-width: 0; } .stp b { min-width: 14px; }
#log { background: var(--paper); border-radius: 10px; padding: 6px 9px; font-size: 12.5px; max-height: 150px; overflow-y: auto; border: 1px solid var(--line); color: #4a3d30; }
#log div { padding: 2px 0; border-bottom: 1px solid #efe6d4; } #log div:last-child { border-bottom: none; font-weight: 600; }

/* board */
.hex.sea { stroke: #2a6aa3; stroke-width: 1; }
.shore { fill: #ead9a8; stroke: #ead9a8; stroke-width: 9; stroke-linejoin: round; }
.hex.land { stroke: rgba(80,60,30,.35); stroke-width: 1.2; }
.shade { fill: url(#hexShade); pointer-events: none; }
.hexicon { pointer-events: none; }
.token { fill: url(#tokGrad); stroke: #7d6744; stroke-width: 1.4; }
.num { font: 700 17px Georgia, serif; text-anchor: middle; fill: #2b2118; pointer-events: none; }
.num.red, .pip.red { fill: #b83a2a; } .pip { fill: #2b2118; }
.pier { stroke: #7a5230; stroke-width: 3.5; stroke-dasharray: 4 2.5; }
.port { fill: url(#portGrad); stroke: #5b3a1a; stroke-width: 1.5; }
.porttxt { font: 800 12px system-ui, sans-serif; text-anchor: middle; fill: #fffaf0; } .porttxt.sm { font-size: 9.5px; }
.robber { fill: url(#robberGrad); stroke: #e8e2d6; stroke-width: 1.4; pointer-events: none; } .robber ellipse { fill: rgba(0,0,0,.35); stroke: none; }
.road { stroke: #1a130c; stroke-width: 1.8; }
.hull { fill: #6b4423; stroke: #2e1c0c; stroke-width: 1.3; } .mast { stroke: #2e1c0c; stroke-width: 1.6; } .sail { stroke: #1a130c; stroke-width: 1.1; }
.ship.sel .hull { stroke: var(--gold); stroke-width: 3; }
.bld { stroke: #1a130c; stroke-width: 1.6; stroke-linejoin: round; }
.roof { fill: rgba(0,0,0,.28); pointer-events: none; } .win { fill: rgba(255,240,190,.85); }
.wall { fill: #a9a196; stroke: #3d3832; stroke-width: 1.6; stroke-linejoin: round; }
.sh { fill: rgba(0,0,0,.32); pointer-events: none; }
.landshadow { fill: rgba(5,25,45,.45); stroke: rgba(5,25,45,.45); stroke-width: 9; stroke-linejoin: round; }
.modal { position: fixed; inset: 0; background: rgba(5,18,32,.72); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 24px 12px; z-index: 20; }
.modal-card { position: relative; background: var(--panel); border-radius: 18px; width: 100%; max-width: 900px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.closex { position: absolute; right: 12px; top: 10px; font-size: 22px; padding: 2px 11px; }
.winhead { text-align: center; padding: 10px 0 14px; border-bottom: 4px solid var(--wc); margin-bottom: 8px; }
.winhead h1 { margin: 4px 0; font-size: 34px; } .crown .ic { width: 44px; height: 44px; }
.wingrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 6px 22px; } .wingrid .wide { grid-column: 1 / -1; }
table.st { width: 100%; border-collapse: collapse; font-size: 13.5px; } table.st th { font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; padding: 4px; }
table.st td { padding: 5px 4px; border-top: 1px solid var(--line); text-align: center; } table.st td:first-child { text-align: left; white-space: nowrap; }
table.st tr.win td { background: #fff6d2; font-weight: 700; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; border: 1px solid rgba(0,0,0,.3); }
.chart { width: 100%; } .chart .ct { font: 700 11px system-ui; text-anchor: middle; fill: #2b2118; } .chart .cl { font: 12px system-ui; text-anchor: middle; fill: #7d6f5d; }
.wide-scroll { overflow-x: auto; }
.hl-v { fill: rgba(255,238,110,.55); stroke: #fff36b; stroke-width: 3; cursor: pointer; animation: pulse 1s infinite alternate; }
.hl-edge { stroke: rgba(255,238,110,.8); stroke-width: 12; stroke-linecap: round; cursor: pointer; animation: pulse 1s infinite alternate; }
.hl-hex { fill: rgba(255,238,110,.16); stroke: #fff36b; stroke-width: 3.5; cursor: pointer; }
.hl-hex:hover { fill: rgba(255,238,110,.42); }
.hl-v:hover, .hl-edge:hover { stroke: #fff; }
@keyframes pulse { from { opacity: .55; } to { opacity: 1; } }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #2b2118; color: #fff; padding: 10px 16px; border-radius: 11px; opacity: 0; pointer-events: none; transition: .25s; z-index: 10; max-width: 90vw; text-align: center; box-shadow: 0 8px 26px rgba(0,0,0,.35); }
#toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<svg id="artDefs" aria-hidden="true"></svg>

<div id="home" class="screen center">
  <div class="box home-box">
    <h1><svg viewBox="0 0 32 32"><polygon points="16,1 29.5,8.5 29.5,23.5 16,31 2.5,23.5 2.5,8.5" fill="url(#pat-wheat)" stroke="#6b5a3e" stroke-width="1.5"/><use href="#ic-island" x="5" y="5" width="22" height="22"/></svg>Hex Isles</h1>
    <p class="tag">Settle, trade and sail with friends. 2 to 4 players.</p>
    <label class="field" for="nameIn">Your name</label>
    <input id="nameIn" maxlength="16" placeholder="e.g. Sam" autocomplete="off">
    <div id="resumeBox" class="card-box hidden">
      <b>You were hosting room <span id="resumeCode"></span>.</b>
      <div class="row" style="margin-top:8px"><button class="primary" id="resumeBtn">Resume that game</button><button id="forgetBtn">Forget it</button></div>
    </div>
    <div class="card-box">
      <b>Host a game</b>
      <p class="small muted" style="margin:4px 0 9px">You'll get a room code for your friends. Keep this tab open while you play: your browser runs the game.</p>
      <button class="primary" id="hostBtn">Create room</button>
    </div>
    <div class="card-box" id="joinBox">
      <b>Join a friend</b>
      <div class="row" style="margin-top:8px"><input id="codeIn" maxlength="2" inputmode="numeric" pattern="[0-9]*" placeholder="Room # (2 digits)" autocomplete="off"><button class="primary" id="joinBtn">Join</button></div>
    </div>
    <div class="card-box">
      <b>Practice on one screen</b>
      <div class="row" style="margin-top:8px"><button id="practiceBtn">Set up a practice game</button></div>
    </div>
  </div>
</div>

<div id="lobby" class="screen hidden"></div>

<div id="game" class="screen hidden">
  <div id="boardWrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="zoombar"><button id="zoomIn" title="Zoom in">+</button><button id="zoomOut" title="Zoom out">−</button><button id="zoomFit" title="Fit board" style="font-size:15px">⤢</button></div>
    <button id="reconnect" class="primary hidden">Reconnect</button>
  </div>
  <aside id="side"><div id="sideGrip" title="Drag to resize"></div>
    <div id="status"></div>
    <div id="players"></div>
    <div id="hand"></div>
    <div id="actions"></div>
    <div id="dev"></div>
    <div id="trade"></div>
    <h3>Log</h3>
    <div id="log"></div>
  </aside>
</div>

<div id="winModal" class="modal hidden"><div class="modal-card"><button id="winClose" class="closex" title="Close">×</button><div id="winBody"></div></div></div>
<div id="toast"></div>

<script>
// ================= GAME ENGINE (rules only, no DOM) =================
const RES = ['wood', 'brick', 'sheep', 'wheat', 'ore'];
const RES_NAME = { wood: 'Lumber', brick: 'Brick', sheep: 'Wool', wheat: 'Grain', ore: 'Ore' };
const TERRAIN_NAME = { hidden: 'Hidden', wood: 'Forest', brick: 'Hills', sheep: 'Pasture', wheat: 'Fields', ore: 'Mountains', gold: 'Gold', desert: 'Desert', sea: 'Sea', random: 'Random', empty: 'Erase' };
const COST = {
  road: { wood: 1, brick: 1 },
  ship: { wood: 1, sheep: 1 },
  settlement: { wood: 1, brick: 1, sheep: 1, wheat: 1 },
  city: { wheat: 2, ore: 3 },
  wall: { brick: 2 },
  dev: { sheep: 1, wheat: 1, ore: 1 },
};
const LIMIT_KEY = { road: 'limRoad', ship: 'limShip', settlement: 'limSettlement', city: 'limCity', wall: 'limWall' };
const lim = (s, kind) => s.opts[LIMIT_KEY[kind]];
const DEV_COUNTS = { knight: 14, vp: 5, roads: 2, plenty: 2, monopoly: 2 };
const DEV_NAME = { knight: 'Knight', vp: 'Victory Point', roads: 'Road Building', plenty: 'Year of Plenty', monopoly: 'Monopoly' };
const PALETTE = [
  { name: 'Red', c: '#d64045' }, { name: 'Blue', c: '#2f6fdb' }, { name: 'Orange', c: '#f39c12' }, { name: 'Green', c: '#2e9e5b' },
  { name: 'White', c: '#f4f1e8' }, { name: 'Purple', c: '#8e44ad' }, { name: 'Brown', c: '#8b5a2b' }, { name: 'Pink', c: '#ec7fb7' },
  { name: 'Teal', c: '#17a2a2' }, { name: 'Black', c: '#2b2b2b' },
];
const COLORS = PALETTE.map(p => p.c);

// ---------- host options ----------
const DEFAULT_OPTS = {
  vpTarget: 13, handLimit: 7, wallBonus: 2, bankSize: 19,
  twoTwelve: true, robber: true, friendlyRobber: false, islandBonus: true, ships: true, shipSameRoute: false, setupLargest: true,
  limRoad: 15, limShip: 15, limSettlement: 5, limCity: 4, limWall: 3,
  goldMode: 'none', goldChance: 10, goldCount: 2, goldHidden: true,
};

async function joinGame() {

  try { await loadPeer(); } catch (e) { return toast(e.message, 5000); }

  const peer = new Peer(); net.peer = peer;
  peer.on('open', () => {
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true });
    net.conn = conn;

// ---------- zoom & pan ----------

const live = { k: 1, tx: 0, ty: 0, active: false };

function highlights(v) {
  const h = { hexes: [], edges: [], verts: [] }, me = ui.me, g = getGeo(v);

  if (v.pending && v.pending.type === 'pick') return h;

    if (v.setupOrder[v.setupIdx] !== me) return h;
    if (v.setupNeed === 'settlement') h.verts = Object.keys(g.V).filter(k => canSettlement(v, me, k));
    else h.edges = Object.keys(g.E).filter(k => canRoad(v, me, k) || canShip(v, me, k));
    return h;
  }
  if (v.turn !== me) return h;
  const pd = v.pending;
  if (pd && pd.type === 'robber') { h.hexes = robberHexes(v, me); return h; }
  if (pd && pd.type === 'freeRoads') { h.edges = legalEdges(v, me, ui.mode === 'ship' ? 'ship' : 'road'); return h; }
  if (pd || !v.rolled) return h;
  if (ui.mode === 'road') h.edges = legalEdges(v, me, 'road');
  if (ui.mode === 'ship') h.edges = legalEdges(v, me, 'ship');
  if (ui.mode === 'settlement') h.verts = Object.keys(g.V).filter(k => canSettlement(v, me, k));
  if (ui.mode === 'city') h.verts = Object.keys(v.bld).filter(k => canCity(v, me, k));
  if (ui.mode === 'wall') h.verts = Object.keys(v.bld).filter(k => canWall(v, me, k));

}

function boardClick(ev) {
  const t = ev.target.closest('[data-v],[data-e],[data-hex]'); if (!t) return;
  const v = ui.view, me = ui.me;
  if (t.dataset.hex !== undefined) return send({ type: 'moveRobber', hex: Number(t.dataset.hex) });
  if (t.dataset.v) {
    if (v.phase === 'setup') return send({ type: 'buildSettlement', v: t.dataset.v });
    const map = { settlement: 'buildSettlement', city: 'buildCity', wall: 'buildWall' };
    if (map[ui.mode]) send({ type: map[ui.mode], v: t.dataset.v });
    return;
  }
  const ek = t.dataset.e;
  if (v.phase === 'setup') {
    const r = canRoad(v, me, ek), s = canShip(v, me, ek);
    const useShip = s && (!r || ui.setupPiece === 'ship');
    return send({ type: useShip ? 'buildShip' : 'buildRoad', e: ek });

    const from = ui.moveFrom; ui.moveFrom = null; ui.mode = null;
    return send({ type: 'moveShip', from, to: ek });
  }

  const me = ui.me, nm = i => esc(v.players[i].name), mine = v.turn === me, pd = v.pending;
  if (v.phase === 'over') return `<b>${nm(v.winner)}</b> wins`;
  if (pd && pd.type === 'pick') return pd.need[me] ? `<b>Take ${pd.need[me]}</b> from the bank` : `${Object.keys(pd.need).map(nm).join(', ')} choosing…`;
  if (v.phase === 'setup') {
    const cur = v.setupOrder[v.setupIdx];
    if (cur !== me) return `${nm(cur)} placing…`;
    return v.setupNeed === 'settlement' ? '<b>Place settlement</b>' : `<b>Place ${v.opts.ships ? 'road / ship' : 'road'}</b>`;
  }
  if (pd && pd.type === 'discard') return pd.need[me] ? `<b>Discard ${pd.need[me]}</b>` : `${Object.keys(pd.need).map(nm).join(', ')} discarding…`;
  if (pd && pd.type === 'robber') return mine ? '<b>Move the robber</b>' : `${nm(v.turn)} moving robber…`;
  if (pd && pd.type === 'steal') return mine ? '<b>Steal from…</b>' : `${nm(v.turn)} stealing…`;
  if (pd && pd.type === 'freeRoads') return mine ? `<b>${pd.left} free</b>` : `${nm(v.turn)} building…`;
  if (!mine) return `${nm(v.turn)}'s turn`;
  return '<b>Your turn</b>';
}

function renderSide(v) {
  const me = ui.me, pl = v.players[me], mine = v.turn === me && v.phase === 'main', pd = v.pending;
  let st = `<div class="topline"><span>${ui.local ? 'Practice game' : 'Room <b>' + esc(net.code || '') + '</b>'}</span><span>${icon('star')} <b>${v.opts.vpTarget}</b> to win</span></div>`;
  if (ui.local) st += `<label class="acting">Playing as <select data-chg="acting">${v.players.map((p, i) => `<option value="${i}" ${i === me ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select> <label class="mini"><input type="checkbox" data-chg="auto" ${ui.actingAuto ? 'checked' : ''}> auto</label></label>`;
  st += `<div class="statusline" style="border-color:${v.phase === 'over' ? v.players[v.winner].color : v.players[v.turn].color}">${statusText(v)}</div>`;
  if (v.phase === 'over') st += `<button class="primary wide" data-do="stats">Game stats</button>`;
  if (v.dice) st += `<div class="dice">${dieSVG(v.dice[0])}${dieSVG(v.dice[1])}<span>${v.dice[0] + v.dice[1]}</span></div>`;
  $('status').innerHTML = st;

  $('players').innerHTML = v.players.map((p, i) => `
    <div class="pl ${i === v.turn && v.phase !== 'over' ? 'cur' : ''}" style="--pc:${p.color}">
      <span class="pn">${esc(p.name)}${i === me ? ' <small>(you)</small>' : ''}${p.connected === false ? ' <small class="off">offline</small>' : ''}</span>
      <span class="vp">${icon('star')}${p.vp}${p.vpTotal !== undefined && p.vpTotal !== p.vp ? `<small>+${p.vpTotal - p.vp}</small>` : ''}</span>
      <span class="st"><span title="Cards in hand">${icon('card')}${p.handCount}</span><span title="Development cards">${icon('scroll')}${p.devCount}</span><span title="Knights played">${icon('sword')}${p.knights}</span><span title="Longest route">${icon('road')}${(v.routeLens || [])[i] || 0}</span></span>
      <span class="badges">${v.longest.p === i ? `<b title="Longest Trade Route (+2)">${icon('road')}+2</b>` : ''}${v.army.p === i ? `<b title="Largest Army (+2)">${icon('sword')}+2</b>` : ''}${p.islandVP ? `<b title="Settled a new island (+1)">${icon('island')}+1</b>` : ''}</span>
    </div>`).join('');

  if (pl.res) {
    const c = countPieces(v, me);
    $('hand').innerHTML = `<div class="hand">${RES.map(r => `<div class="card ${r}">${icon(r, 'big')}<b>${pl.res[r]}</b><small>${RES_NAME[r]}</small></div>`).join('')}</div>
      <div class="pieces small muted">Roads ${lim(v, 'road') - c.road}${v.opts.ships ? ` · Ships ${lim(v, 'ship') - c.ship}` : ''} · Settlements ${lim(v, 'settlement') - c.settlement} · Cities ${lim(v, 'city') - c.city} · Walls ${lim(v, 'wall') - c.wall}${v.opts.robber ? ` · Hand limit ${handLimit(v, me)}` : ''}</div>`;
  } else $('hand').innerHTML = '';

  let A = '';
  if (v.phase === 'setup' && v.setupOrder[v.setupIdx] === me && v.setupNeed === 'road' && v.opts.ships) {
    A += `<div class="row"><div class="seg">${['road', 'ship'].map(k => `<button data-do="setupPiece" data-k="${k}" class="${ui.setupPiece === k ? 'on' : ''}">${k === 'road' ? 'Road' : 'Ship'}</button>`).join('')}</div></div>`;
  }
  if (pd && pd.type === 'pick' && pd.need[me]) {
    const tot = RES.reduce((t, r) => t + ui.pick[r], 0), bank = v.bank;
    A += `<h3>Take ${pd.need[me]} (${tot})</h3>${stepperRow('pick', ui.pick, bank, tot >= pd.need[me])}<button class="primary wide" data-do="pick" ${tot !== pd.need[me] ? 'disabled' : ''}>Take</button>`;
  }
  if (pd && pd.type === 'discard' && pd.need[me]) {
    const tot = RES.reduce((t, r) => t + ui.discard[r], 0);
    A += `<h3>Discard ${pd.need[me]} (${tot})</h3>${stepperRow('discard', ui.discard, pl.res, tot >= pd.need[me])}<button class="primary wide" data-do="discard" ${tot !== pd.need[me] ? 'disabled' : ''}>Discard</button>`;
  }
  if (mine && pd && pd.type === 'steal') A += `<h3>Steal from</h3><div class="row">${pd.targets.map(i => `<button data-do="steal" data-k="${i}" style="border-color:${v.players[i].color}">${esc(v.players[i].name)} (${v.players[i].handCount} cards)</button>`).join('')}</div>`;
  if (mine && pd && pd.type === 'freeRoads') {
    A += `<div class="row">${v.opts.ships ? `<div class="seg">${['road', 'ship'].map(k => `<button data-do="mode" data-k="${k}" class="${(ui.mode === 'ship' ? 'ship' : 'road') === k ? 'on' : ''}">Free ${k}</button>`).join('')}</div>` : ''}<button data-do="endFree">Done</button></div>`;
  }
  if (mine && !pd) {
    if (!v.rolled) A += `<button class="primary big" data-do="roll">Roll dice</button>`;
    else {
      const items = [['road', 'Road'], ...(v.opts.ships ? [['ship', 'Ship']] : []), ['settlement', 'Settlement'], ['city', 'City'], ['wall', 'City wall']];
      A += `<div class="grid">` + items.map(([k, label]) =>
        `<button data-do="mode" data-k="${k}" class="build ${ui.mode === k ? 'on' : ''}" ${canAfford(pl, COST[k]) ? '' : 'disabled'}><span>${label}</span><small>${costChips(COST[k])}</small></button>`).join('') +
        `<button data-do="buyDev" class="build" ${canAfford(pl, COST.dev) && v.devLeft ? '' : 'disabled'}><span>Dev card <small class="muted">(${v.devLeft})</small></span><small>${costChips(COST.dev)}</small></button>` +
        (v.opts.ships ? `<button data-do="mode" data-k="moveShip" class="build ${ui.mode === 'moveShip' ? 'on' : ''}" ${v.shipMoved || !Object.keys(v.ships).some(k => shipMovable(v, me, k)) ? 'disabled' : ''}><span>Move ship</span><small class="muted">1 per turn</small></button>` : '') +
        `</div>`;
      A += `<button class="end" data-do="endTurn">End turn</button>`;
    }
  }
  $('actions').innerHTML = A;

  let D = '';
  if (pl.dev && pl.dev.length) {
    const groups = {};
    pl.dev.forEach(d => { groups[d.t] = groups[d.t] || { n: 0, ready: 0 }; groups[d.t].n++; if (d.turn !== v.turnNum) groups[d.t].ready++; });
    const canPlay = t => v.phase === 'main' && v.turn === me && !v.devPlayed && groups[t].ready > 0 && t !== 'vp' && !pd;
    D = `<h3>Development cards</h3>` + Object.keys(groups).map(t => {
      let extra = '';
      if (t === 'plenty') extra = resSelect('plenty0', ui.plenty[0]) + resSelect('plenty1', ui.plenty[1]);
      if (t === 'monopoly') extra = resSelect('mono', ui.mono);
      return `<div class="devrow"><span><b>${DEV_NAME[t]}</b> ×${groups[t].n}${groups[t].ready < groups[t].n ? ` <small class="muted">(${groups[t].n - groups[t].ready} new)</small>` : ''}</span>
        ${t === 'vp' ? '<small class="muted">counts automatically</small>' : `<span class="row">${extra}<button data-do="playDev" data-k="${t}" ${canPlay(t) ? '' : 'disabled'}>Play</button></span>`}</div>`;
    }).join('');
  }
  $('dev').innerHTML = D;

  let T = '';
  const fmt = m => costChips(m) || '—';
  if (v.trade) {
    const t = v.trade, from = v.players[t.from];
    T += `<h3>Trade offer</h3><div class="offer"><b style="color:${from.color}">${esc(from.name)}</b> gives <span class="chips">${fmt(t.give)}</span> for <span class="chips">${fmt(t.get)}</span></div>`;
    if (t.from === me) {
      T += `<div class="row">${t.accepts.map(i => `<button class="primary" data-do="confirmTrade" data-k="${i}">Trade with ${esc(v.players[i].name)}</button>`).join('')}<button data-do="cancelTrade">Cancel</button></div>`;
      if (t.declines.length) T += `<div class="small muted">Declined: ${t.declines.map(i => esc(v.players[i].name)).join(', ')}</div>`;
      if (!t.accepts.length) T += `<div class="small muted">Waiting for answers…</div>`;
    } else {
      const status = t.accepts.includes(me) ? 'You accepted.' : t.declines.includes(me) ? 'You declined.' : '';
      T += `<div class="row"><button class="primary" data-do="respond" data-k="1" ${canAfford(pl, t.get) ? '' : 'disabled'}>Accept</button><button data-do="respond" data-k="0">Decline</button> <span class="small muted">${status}</span></div>`;
    }
  } else if (myTurnFree(v)) {
    const ratio = portRatio(v, me, ui.bankGive);
    T += `<details ${ui.tradeOpen ? 'open' : ''} data-chg="tradeOpen"><summary>Trade</summary>
      <div class="tradebox"><div class="small"><b>With the bank</b></div>
      <div class="row">Give <b>${ratio}</b>${resSelect('bankGive', ui.bankGive)} get <b>1</b>${resSelect('bankGet', ui.bankGet)}<button data-do="bankTrade" ${pl.res[ui.bankGive] >= ratio && ui.bankGive !== ui.bankGet ? '' : 'disabled'}>Trade</button></div>
      <div class="small" style="margin-top:8px"><b>Offer to players.</b> You give:</div>${stepperRow('tradeGive', ui.tradeGive, pl.res)}<div class="small">You want:</div>${stepperRow('tradeGet', ui.tradeGet, null)}
      <button class="wide" data-do="propose">Send offer</button></div></details>`;
  }
  $('trade').innerHTML = T;

  const logEl = $('log');
  logEl.innerHTML = v.log.slice(-50).map(l => `<div>${esc(l)}</div>`).join('');
  if (ui.logLen !== v.log.length) logEl.scrollTop = logEl.scrollHeight;
  ui.logLen = v.log.length;
}

function resSelect(key, val) {
  return `<select data-chg="${key}">${RES.map(r => `<option value="${r}" ${r === val ? 'selected' : ''}>${RES_NAME[r]}</option>`).join('')}</select>`;
}
function stepperRow(key, map, max, full) {
  return `<div class="steppers">${RES.map(r => `<div class="stp">${icon(r)}<div><button data-do="step" data-k="${key}" data-r="${r}" data-d="-1" ${map[r] ? '' : 'disabled'}>−</button><b>${map[r]}</b><button data-do="step" data-k="${key}" data-r="${r}" data-d="1" ${(max && map[r] >= max[r]) || full ? 'disabled' : ''}>+</button></div></div>`).join('')}</div>`;
}

function sideClick(ev) {
  const b = ev.target.closest('[data-do]'); if (!b || b.disabled) return;
  const k = b.dataset.k;
  switch (b.dataset.do) {
    case 'roll': return send({ type: 'roll' });
    case 'stats': return showWin();
    case 'endTurn': ui.mode = null; return send({ type: 'endTurn' });
    case 'mode': ui.moveFrom = null; ui.mode = (!k || ui.mode === k) ? null : k; return render();
    case 'setupPiece': ui.setupPiece = k; return render();
    case 'buyDev': return send({ type: 'buyDev' });
    case 'endFree': ui.mode = null; return send({ type: 'endFreeRoads' });
    case 'steal': return send({ type: 'steal', target: Number(k) });
    case 'discard': { const res = { ...ui.discard }; ui.discard = emptyRes(); return send({ type: 'discard', res }); }
    case 'pick': { const res = { ...ui.pick }; ui.pick = emptyRes(); return send({ type: 'pick', res }); }
    case 'step': {
      const m = ui[k], r = b.dataset.r; m[r] = Math.max(0, m[r] + Number(b.dataset.d));
      if (k === 'tradeGive' && m[r]) ui.tradeGet[r] = 0;
      if (k === 'tradeGet' && m[r]) ui.tradeGive[r] = 0;
      return render();
    }
    case 'playDev': {
      const a = { type: 'playDev', card: k };
      if (k === 'plenty') { a.r1 = ui.plenty[0]; a.r2 = ui.plenty[1]; }
      if (k === 'monopoly') a.r = ui.mono;
      if (k === 'roads') ui.mode = 'road';
      return send(a);
    }
    case 'bankTrade': return send({ type: 'bankTrade', give: ui.bankGive, get: ui.bankGet });
    case 'propose': { const a = { type: 'proposeTrade', give: { ...ui.tradeGive }, get: { ...ui.tradeGet } }; ui.tradeGive = emptyRes(); ui.tradeGet = emptyRes(); return send(a); }
    case 'confirmTrade': return send({ type: 'confirmTrade', with: Number(k) });
    case 'cancelTrade': return send({ type: 'cancelTrade' });
    case 'respond': return send({ type: 'respondTrade', accept: k === '1' });
  }
}
function sideChange(ev) {
  const el = ev.target, k = el.dataset.chg; if (!k) return;
  if (k === 'acting') { ui.me = Number(el.value); ui.actingAuto = false; ui.mode = null; hostChanged(); return; }
  if (k === 'auto') { ui.actingAuto = el.checked; hostChanged(); return; }
  if (k === 'plenty0') ui.plenty[0] = el.value;
  else if (k === 'plenty1') ui.plenty[1] = el.value;
  else ui[k] = el.value;
  render();
}

// ---------- wire up ----------
function init() {
  $('artDefs').innerHTML = ART_DEFS;
  $('nameIn').value = store.get('hexisles-name') || '';
  const params = new URLSearchParams(location.search);
  $('codeIn').value = String(params.get('room') || store.get('hexisles-code') || '').replace(/\D/g, '').slice(0, 2);
  if (params.get('room')) $('joinBox').classList.add('focus');
  const saved = store.get('hexisles-host');
  if (saved && saved.state && saved.state.phase !== 'over') { $('resumeBox').classList.remove('hidden'); $('resumeCode').textContent = saved.code; }
  $('hostBtn').onclick = hostGame;
  $('joinBtn').onclick = joinGame;
  $('practiceBtn').onclick = practice;
  $('resumeBtn').onclick = resumeHost;
  $('forgetBtn').onclick = () => { store.del('hexisles-host'); $('resumeBox').classList.add('hidden'); };
  $('reconnect').onclick = joinGame;
  $('lobby').addEventListener('click', lobbyClick);
  $('lobby').addEventListener('change', lobbyChange);
  $('lobby').addEventListener('pointerdown', lobbyPointer);
  $('lobby').addEventListener('pointermove', lobbyPointer);
  $('board').addEventListener('click', boardClick);
  $('side').addEventListener('click', sideClick);
  $('side').addEventListener('change', sideChange);
  $('side').addEventListener('toggle', e => { if (e.target.matches('details[data-chg="tradeOpen"]')) ui.tradeOpen = e.target.open; }, true);
  setupZoom();
  $('winClose').onclick = () => $('winModal').classList.add('hidden');
  // drag the side panel's left edge to resize it (desktop)
  const savedW = store.get('hexisles-sidew'); if (savedW) $('side').style.width = savedW + 'px';
  $('sideGrip').addEventListener('pointerdown', e => {
    e.preventDefault(); const grip = e.currentTarget; grip.setPointerCapture(e.pointerId);
    const move = ev => { const w = Math.min(700, Math.max(290, window.innerWidth - ev.clientX)); $('side').style.width = w + 'px'; };
    const up = ev => { grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); store.set('hexisles-sidew', parseInt($('side').style.width)); if (ui.view) { ui.boardId = null; render(); } };
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up);
  });
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.mode) { ui.mode = null; ui.moveFrom = null; render(); } });
  window.addEventListener('beforeunload', e => { if (net.role === 'host' && hostState && hostState.phase !== 'over') { e.preventDefault(); e.returnValue = ''; } });
}
init();

</script>
</body>
</html>
